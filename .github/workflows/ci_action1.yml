name: My First CI Action
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Install dependencies
        working-directory: ./supportingProject
        run: npm ci
      - name: Run tests
        working-directory: ./supportingProject
        run: npm test